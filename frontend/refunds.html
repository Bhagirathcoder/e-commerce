<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refunds | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <h1 class="h4">Your Refunds</h1>
    <div class="bb-card" id="list">
      <div class="loader"></div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    (async () => {
      if (!await BB.init({ auth: true, roles: ['USER'] })) return; const el = BB.$('#list');
      try { const l = await BB.api('/api/refunds'); BB.table(el, [{ h: 'Refund', f: r => '#' + r.id }, { h: 'Order', f: r => '<a href="/order-details.html?id=' + r.orderId + '">#' + r.orderId + '</a>' }, { h: 'Amount', f: r => BB.money(r.amount) }, { h: 'Sent to', f: r => BB.esc(r.destination) }, { h: 'Status', f: r => BB.badge(r.status) }, { h: 'Initiated', f: r => BB.dt(r.createdAt) }, { h: 'Completed', f: r => BB.dt(r.completedAt) }], l, 'No refunds yet. Refunds appear after an approved return or a cancelled paid order.'); } catch (e) { BB.errorState(el, e); }
    })();

  </script>
</body>

</html>
