spring.application.name=ByteBazaar
server.port=8081

# ---- MySQL (override with env vars) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/bytebazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---- Serve the frontend/ folder (run from backend/) + built-in classpath fallback ----
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# ---- Uploads ----
bytebazaar.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ---- Security ----
# CHANGE THIS in any real deployment: export JWT_SECRET=<random 32+ chars>
bytebazaar.jwt.secret=${JWT_SECRET:dev-only-change-me-bytebazaar-jwt-secret-key-32chars-min}
bytebazaar.jwt.expiry-hours=24

# ---- App ----
bytebazaar.base-url=${APP_BASE_URL:http://localhost:8081}
bytebazaar.mail.from=${MAIL_FROM:no-reply@bytebazaar.com}

# ---- Payments (UPI) ----
# simulate=true enables the DEMO "Pay Now" simulator. Set false when a real gateway (e.g. Razorpay) is wired in.
bytebazaar.payment.simulate=${PAYMENT_SIMULATE:true}
bytebazaar.payment.merchant-upi=${MERCHANT_UPI:admin@demo}
bytebazaar.payment.gateway-key=${PAYMENT_GATEWAY_KEY:}
bytebazaar.payment.gateway-secret=${PAYMENT_GATEWAY_SECRET:}

# ---- AI support (optional external LLM hook; rule-based engine works without it) ----
bytebazaar.ai.api-key=${AI_API_KEY:}

# ---- Mail (optional). Set env vars SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
# Without SPRING_MAIL_HOST, emails are written to the console log instead of being sent.
