<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat with Admin | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h1 class="h4 mb-0">Chat with Admin</h1><a href="/support.html">← Help & Support</a>
        </div>
        <div class="chat-box">
          <div class="chat-head"><i class="bi bi-person-headset me-2"></i>ByteBazaar Support Team</div>
          <div class="chat-body" id="cb"></div>
          <form class="chat-input" id="cf"><input class="form-control" id="ci" placeholder="Type your message…"
              autocomplete="off" maxlength="1000"><button class="btn btn-bb"><i class="bi bi-send"></i></button></form>
        </div>
        <div class="small text-muted mt-2">An admin replies here — this page refreshes automatically.</div>
      </div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$; let last = '';
    async function load() {
      try {
        const l = await BB.api('/api/support/messages'); const sig = JSON.stringify(l.map(m => m.id)); if (sig === last) return; last = sig;
        $('#cb').innerHTML = l.length ? l.map(m => `<div class="msg ${m.sender === 'USER' ? 'me' : 'them'}">${BB.esc(m.message)}<small>${m.sender === 'USER' ? 'You' : 'Admin'} · ${BB.dt(m.createdAt)}</small></div>`).join('') : '<div class="text-muted text-center mt-5">Say hello 👋 — an admin will reply soon.</div>'; $('#cb').scrollTop = 1e9;
      } catch (e) { }
    }
    (async () => {
      if (!await BB.init({ auth: true })) return; load(); setInterval(load, 5000);
      $('#cf').onsubmit = async e => { e.preventDefault(); const v = $('#ci').value.trim(); if (!v) return; $('#ci').value = ''; try { await BB.api('/api/support/messages', { method: 'POST', body: { message: v } }); load(); } catch (x) { BB.fail(x); } };
    })();

  </script>
</body>

</html>
