<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Orders | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="dash">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="dash-main">
            <div class="dash-top" id="dash-top"></div>
            <div class="d-flex gap-2 mb-3"><select class="form-select w-auto" id="sf">
                    <option value="">All statuses</option>
                    <option>PLACED</option>
                    <option>CONFIRMED</option>
                    <option>PROCESSING</option>
                    <option>SHIPPING</option>
                    <option>OUT_FOR_DELIVERY</option>
                    <option>DELIVERED</option>
                    <option>CANCELLED</option>
                </select></div>
            <div class="table-card" id="t"></div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="/js/dash.js"></script>
    <script>
        const $ = BB.$;
        if (BB.dash('ADMIN', 'orders', 'Orders')) {

            const FLOW = ['PLACED', 'CONFIRMED', 'PROCESSING', 'SHIPPING', 'OUT_FOR_DELIVERY', 'DELIVERED']; let all = [];
            async function load() { try { all = await BB.api('/api/admin/orders'); draw(); } catch (e) { BB.errorState($('#t'), e); } }
            function draw() {
                const f = $('#sf').value; const l = all.filter(o => !f || o.status === f);
                BB.table($('#t'), [{ h: 'Order', f: o => '#' + o.id }, { h: 'Customer', f: o => BB.esc(o.customerName) + '<br><small>' + BB.esc(o.customerPhone) + '</small>' }, { h: 'Items', f: o => o.items.map(i => BB.esc(i.name) + ' ×' + i.quantity + ' <small class="text-muted">(' + BB.esc(i.seller) + ')</small>').join('<br>') }, { h: 'Total', f: o => BB.money(o.total) }, { h: 'Payment', f: o => o.paymentMethod + '<br>' + BB.badge(o.paymentStatus) }, { h: 'Date', f: o => BB.dt(o.createdAt) }, { h: 'Status', f: o => BB.badge(o.status) },
                { h: '', f: o => `<div class="d-flex gap-1"><button class="btn btn-sm btn-outline-secondary" data-t="${o.id}">Tracking</button>${o.status !== 'DELIVERED' && o.status !== 'CANCELLED' ? `<button class="btn btn-sm btn-bb" data-u="${o.id}">Update</button>` : ''}<button class="btn btn-sm btn-outline-secondary" data-i="${o.id}"><i class="bi bi-file-earmark-pdf"></i></button></div>` }], l, 'No orders');
                BB.$$('[data-u]').forEach(b => b.onclick = () => { const o = all.find(x => x.id == b.dataset.u); const nx = FLOW.slice(FLOW.indexOf(o.status) + 1).concat(['CANCELLED']); BB.statusModal(o, nx, '/api/admin', load); });
                BB.$$('[data-i]').forEach(b => b.onclick = () => BB.download('/api/orders/' + b.dataset.i + '/invoice', 'ByteBazaar-Invoice-' + b.dataset.i + '.pdf'));
                BB.$$('[data-t]').forEach(b => b.onclick = async () => { try { const t = await BB.api('/api/orders/' + b.dataset.t + '/tracking'); BB.modal('Tracking · order #' + b.dataset.t, BB.timeline(t)); } catch (e) { BB.fail(e); } });
            }
            $('#sf').onchange = draw; load();
        }
    </script>
</body>

</html>
