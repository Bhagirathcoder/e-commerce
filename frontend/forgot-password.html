<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forgot password | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div id="bb-header"></div>
    <main class="container-xl page-wrap pt-3">
        <div class="auth-wrap">
            <div class="logo-big"><img src="/images/logo.svg" alt="ByteBazaar"></div>
            <h4>Forgot password?</h4>
            <p class="text-muted">Enter your account email and we'll send you a reset link.</p>
            <form id="f"><input class="form-control mb-3" type="email" name="email" placeholder="Email" required><button
                    class="btn btn-bb w-100" id="go">Send reset link</button></form>
            <div id="done" class="alert alert-success mt-3" style="display:none"></div>
            <div class="text-center mt-3"><a href="/login.html">Back to sign in</a></div>
        </div>
    </main>
    <div id="bb-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>

        (async () => { await BB.init(); BB.$('#f').onsubmit = async e => { e.preventDefault(); BB.spin(BB.$('#go'), true); try { const r = await BB.api('/api/auth/forgot-password', { method: 'POST', body: { email: e.target.email.value } }); const d = BB.$('#done'); d.style.display = 'block'; d.textContent = r.message + ' (Development: if SMTP is not configured, the link is printed in the server console.)'; } catch (x) { BB.fail(x); } BB.spin(BB.$('#go'), false); }; })();

    </script>
</body>

</html>
