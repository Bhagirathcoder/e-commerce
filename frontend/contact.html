<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact us | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div id="bb-header"></div>
    <main class="container-xl page-wrap pt-3">
        <div class="row g-3">
            <div class="col-lg-7">
                <div class="bb-card">
                    <h1 class="h4">Contact us</h1>
                    <form id="f" class="row g-3">
                        <div class="col-md-6"><label class="form-label">Name</label><input class="form-control"
                                name="name" required></div>
                        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control"
                                type="email" name="email" required></div>
                        <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control"
                                name="phone"></div>
                        <div class="col-md-6"><label class="form-label">Subject</label><input class="form-control"
                                name="subject" required></div>
                        <div class="col-12"><label class="form-label">Message</label><textarea class="form-control"
                                rows="5" name="message" required maxlength="3500"></textarea></div>
                        <div class="col-12"><button class="btn btn-bb" id="go">Submit</button></div>
                    </form>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="bb-card">
                    <h5>Need help faster?</h5>
                    <p>Our AI assistant and admin chat are available 24×7.</p><a class="btn btn-navy"
                        href="/support.html"><i class="bi bi-headset"></i> Open Help & Support</a>
                    <hr>
                    <div class="small text-muted">ByteBazaar Demo HQ, Bhubaneswar, Odisha<br>support@bytebazaar.com
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="bb-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>

        (async () => {
            await BB.init(); const u = BB.user(); const f = BB.$('#f'); if (u) { f.name.value = u.fullName; f.email.value = u.email; f.phone.value = u.phone; }
            f.onsubmit = async e => { e.preventDefault(); BB.spin(BB.$('#go'), true); try { const r = await BB.api('/api/contact', { method: 'POST', body: Object.fromEntries(new FormData(f)) }); BB.toast(r.message); f.subject.value = ''; f.message.value = ''; } catch (x) { BB.fail(x); } BB.spin(BB.$('#go'), false); };
        })();

    </script>
</body>

</html>
