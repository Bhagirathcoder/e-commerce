<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refunds | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="alert alert-info small">Demo mode: refunds are simulated — no real money moves. The refund service is
        isolated so a payment-gateway refund API can be plugged in.</div>
      <div class="table-card" id="t"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('ADMIN', 'refunds', 'Refunds')) {

      async function load() {
        try {
          const l = await BB.api('/api/admin/refunds'); BB.table($('#t'), [{ h: '#', f: r => r.id }, { h: 'Return', f: r => r.returnId ? ('#' + r.returnId) : 'Cancellation' }, { h: 'Order', f: r => '#' + r.orderId }, { h: 'Customer', f: r => BB.esc(r.customer) }, { h: 'Amount', f: r => BB.money(r.amount) }, { h: 'Destination', f: r => BB.esc(r.destination) }, { h: 'Status', f: r => BB.badge(r.status) }, { h: 'Initiated', f: r => BB.dt(r.createdAt) }, { h: '', f: r => r.status === 'INITIATED' ? `<button class="btn btn-sm btn-success" data-c="${r.id}">Complete refund</button>` : BB.dt(r.completedAt) }], l, 'No refunds yet');
          BB.$$('[data-c]').forEach(b => b.onclick = async () => { if (await BB.confirmBox('Mark this refund as completed (simulated payout)?', 'Complete')) { try { await BB.api('/api/admin/refunds/' + b.dataset.c + '/complete', { method: 'PUT' }); BB.toast('Refund completed'); load(); } catch (e) { BB.fail(e); } } });
        } catch (e) { BB.errorState($('#t'), e); }
      }
      load();
    }
  </script>
</body>

</html>
