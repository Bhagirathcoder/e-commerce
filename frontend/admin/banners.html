<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Banners | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="d-flex justify-content-between mb-3"><span class="text-muted">Hero banners scroll right → left on the
          home page.</span><button class="btn btn-bb" id="nb"><i class="bi bi-plus-lg"></i> New banner</button></div>
      <div class="table-card" id="t"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('ADMIN', 'banners', 'Banners')) {

      let all = [];
      async function load() {
        try {
          all = await BB.api('/api/admin/banners'); BB.table($('#t'), [{ h: 'Order', f: b => b.sortOrder }, { h: 'Preview', f: b => `<div style="background:${BB.esc(b.bgColor)};color:#fff;padding:6px 10px;border-radius:8px;min-width:150px"><b>${BB.esc(b.saleTitle)}</b><br><small>${BB.esc(b.discountText || '')}</small></div>` }, { h: 'Product', f: b => BB.esc(b.productName || '') }, { h: 'CTA', f: b => BB.esc(b.ctaText) + ' → ' + BB.esc(b.link || '') }, { h: 'Active', f: b => b.active ? BB.badge('ACTIVE') : BB.badge('BLOCKED').replace('BLOCKED', 'HIDDEN') }, { h: '', f: b => `<button class="btn btn-sm btn-outline-primary" data-e="${b.id}">Edit</button> <button class="btn btn-sm btn-outline-danger" data-x="${b.id}">Delete</button>` }], all, 'No banners');
          BB.$$('[data-e]').forEach(b => b.onclick = () => open(all.find(x => x.id == b.dataset.e)));
          BB.$$('[data-x]').forEach(b => b.onclick = async () => { if (await BB.confirmBox('Delete this banner?', 'Delete')) { await BB.api('/api/admin/banners/' + b.dataset.x, { method: 'DELETE' }); load(); } });
        } catch (e) { BB.errorState($('#t'), e); }
      }
      function open(b) {
        let img = b ? b.imageUrl || '' : ''; const m = BB.modal(b ? 'Edit banner' : 'New banner', `<form id="bf" class="row g-2"><div class="col-12"><label class="form-label">Sale title *</label><input class="form-control" name="saleTitle" required value="${BB.esc(b?.saleTitle)}" placeholder="GREAT FESTIVAL SALE"></div><div class="col-12"><label class="form-label">Product name / headline</label><input class="form-control" name="productName" value="${BB.esc(b?.productName)}"></div><div class="col-md-6"><label class="form-label">Discount text</label><input class="form-control" name="discountText" value="${BB.esc(b?.discountText)}" placeholder="Up to 70% OFF"></div><div class="col-md-6"><label class="form-label">Button text</label><input class="form-control" name="ctaText" value="${BB.esc(b?.ctaText || 'Shop Now')}"></div><div class="col-md-8"><label class="form-label">Link</label><input class="form-control" name="link" value="${BB.esc(b?.link || '/products.html')}"></div><div class="col-md-2"><label class="form-label">Colour</label><input class="form-control form-control-color" type="color" name="bgColor" value="${BB.esc(b?.bgColor || '#0f2742')}"></div><div class="col-md-2"><label class="form-label">Order</label><input class="form-control" type="number" name="sortOrder" value="${b ? b.sortOrder : 0}"></div><div class="col-12"><label class="form-label">Product image (optional)</label><input class="form-control" type="file" id="bi" accept=".jpg,.jpeg,.png,.webp"><div class="small text-muted" id="bim">${img ? BB.esc(img) : ''}</div></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="active" id="ba" ${!b || b.active ? 'checked' : ''}><label class="form-check-label" for="ba">Active</label></div></form>`, { footer: '<button class="btn btn-bb" id="bs">Save</button>' });
        $('#bi', m.el).onchange = async e => { const fd = new FormData(); fd.append('file', e.target.files[0]); try { img = (await BB.api('/api/uploads', { method: 'POST', form: fd })).url; $('#bim', m.el).textContent = img; } catch (x) { BB.fail(x); } };
        $('#bs', m.el).onclick = async () => { const f = $('#bf', m.el); if (!f.reportValidity()) return; const d = Object.fromEntries(new FormData(f)); d.imageUrl = img; d.active = !!d.active; d.sortOrder = +d.sortOrder; try { await BB.api(b ? '/api/admin/banners/' + b.id : '/api/admin/banners', { method: b ? 'PUT' : 'POST', body: d }); m.close(); BB.toast('Saved'); load(); } catch (e) { BB.fail(e); } };
      }
      $('#nb').onclick = () => open(null); load();
    }
  </script>
</body>

</html>
