<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tc">Customer
            conversations</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tm">Contact
            messages</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tc">
          <div class="row g-3">
            <div class="col-lg-4">
              <div class="table-card" id="cv" style="max-height:560px;overflow:auto"></div>
            </div>
            <div class="col-lg-8">
              <div class="chat-box">
                <div class="chat-head" id="ch">Select a conversation</div>
                <div class="chat-body" id="cb"></div>
                <form class="chat-input" id="cf"><input class="form-control" id="ci" placeholder="Reply…"
                    autocomplete="off" disabled><button class="btn btn-bb" disabled><i class="bi bi-send"></i></button>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tm">
          <div class="table-card" id="cm"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('ADMIN', 'support', 'Support')) {

      let cur = null;
      async function convs() { try { const l = await BB.api('/api/admin/support'); $('#cv').innerHTML = l.length ? l.map(c => `<div class="p-2 border-bottom ${cur == c.userId ? 'bg-light' : ''}" style="cursor:pointer" data-u="${c.userId}"><div class="d-flex justify-content-between"><b>${BB.esc(c.userName)}</b>${c.unread ? `<span class="badge bg-danger">${c.unread}</span>` : ''}</div><div class="small text-muted text-truncate">${BB.esc(c.lastMessage)}</div><div class="small text-muted">${BB.dt(c.lastAt)}</div></div>`).join('') : '<div class="text-muted p-3">No customer conversations yet.</div>'; BB.$$('[data-u]').forEach(d => d.onclick = () => open(d.dataset.u, d.querySelector('b').textContent)); } catch (e) { } }
      async function open(id, name) { cur = id; $('#ch').textContent = 'Chat with ' + (name || 'customer'); $('#ci').disabled = false; $('#cf button').disabled = false; thread(); convs(); }
      async function thread() { if (!cur) return; try { const l = await BB.api('/api/admin/support/' + cur); $('#cb').innerHTML = l.map(m => `<div class="msg ${m.sender === 'ADMIN' ? 'me' : 'them'}">${BB.esc(m.message)}<small>${m.sender === 'ADMIN' ? 'Admin' : 'Customer'} · ${BB.dt(m.createdAt)}</small></div>`).join(''); $('#cb').scrollTop = 1e9; } catch (e) { } }
      $('#cf').onsubmit = async e => { e.preventDefault(); const v = $('#ci').value.trim(); if (!v || !cur) return; $('#ci').value = ''; try { await BB.api('/api/admin/support/' + cur, { method: 'POST', body: { message: v } }); thread(); } catch (x) { BB.fail(x); } };
      async function contacts() {
        try {
          const l = await BB.api('/api/admin/contact-messages'); BB.table($('#cm'), [{ h: 'Date', f: c => BB.dt(c.createdAt) }, { h: 'From', f: c => BB.esc(c.name) + '<br><small>' + BB.esc(c.email) + ' · ' + BB.esc(c.phone || '') + '</small>' }, { h: 'Subject', f: c => BB.esc(c.subject) }, { h: 'Message', f: c => '<div style="max-width:380px;white-space:pre-wrap">' + BB.esc(c.message) + '</div>' }, { h: 'Status', f: c => BB.badge(c.status) }, { h: '', f: c => c.status === 'OPEN' ? `<button class="btn btn-sm btn-outline-success" data-c="${c.id}">Close</button>` : '' }], l, 'No contact messages');
          BB.$$('[data-c]').forEach(b => b.onclick = async () => { await BB.api('/api/admin/contact-messages/' + b.dataset.c + '/close', { method: 'PUT' }); contacts(); });
        } catch (e) { }
      }
      convs(); contacts(); setInterval(() => { convs(); thread(); }, 6000);
    }
  </script>
</body>

</html>
