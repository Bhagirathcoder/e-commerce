<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Commission | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="row g-3 mb-3" id="cards"></div>
      <div class="table-card" id="t">
        <div class="loader"></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('SELLER', 'commission', 'Commission')) {

      (async () => {
        try {
          const d = await BB.api('/api/seller/commission'); const s = BB.stat;
          $('#cards').innerHTML = s('bi-currency-rupee', '#0a7ea4', 'Total Sales', BB.money(d.totalSales)) + s('bi-percent', '#7a1fa2', 'Commission (' + d.commissionPercent + '% current rate)', BB.money(d.commission)) + s('bi-wallet2', '#067d62', 'Net Earnings', BB.money(d.netEarnings)) + s('bi-bank', '#173a63', 'Paid Out', BB.money(d.paidOut));
          BB.table($('#t'), [{ h: 'Order', f: r => '#' + r.orderId }, { h: 'Product', f: r => BB.esc(r.productName) }, { h: 'Sale', f: r => BB.money(r.saleAmount) }, { h: 'Commission %', f: r => r.commissionPct + '%' }, { h: 'Commission', f: r => BB.money(r.commissionAmount) }, { h: 'Your amount', f: r => '<b>' + BB.money(r.sellerAmount) + '</b>' }, { h: 'Payment', f: r => BB.badge(r.paymentStatus) }, { h: 'Date', f: r => BB.dateOnly(r.createdAt) }], d.records, 'Commission is calculated when an order is delivered.');
        } catch (e) { BB.errorState($('#t'), e); }
      })();
    }
  </script>
</body>

</html>
