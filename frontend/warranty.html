<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Warranty | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <h1 class="h4">Warranty certificates</h1>
    <div class="bb-card" id="list">
      <div class="loader"></div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    (async () => {
      if (!await BB.init({ auth: true, roles: ['USER'] })) return; const el = BB.$('#list');
      try {
        const l = (await BB.api('/api/orders')).filter(o => o.status === 'DELIVERED' && o.items.some(i => i.warrantyMonths > 0)); const rows = []; l.forEach(o => o.items.filter(i => i.warrantyMonths > 0).forEach(i => rows.push({ o, i })));
        BB.table(el, [{ h: 'Product', f: r => BB.esc(r.i.name) }, { h: 'Order', f: r => '#' + r.o.id }, { h: 'Warranty start', f: r => BB.dateOnly(r.o.deliveredAt) }, { h: 'Period', f: r => r.i.warrantyMonths + ' months' }, { h: '', f: r => '<button class="btn btn-sm btn-navy" data-o="' + r.o.id + '" data-i="' + r.i.id + '"><i class="bi bi-shield-check"></i> Download Warranty Invoice</button>' }], rows, 'Warranty certificates appear after delivery for products that have a warranty.');
        BB.$$('[data-o]').forEach(b => b.onclick = () => BB.download('/api/orders/' + b.dataset.o + '/warranty?itemId=' + b.dataset.i, 'ByteBazaar-Warranty-' + b.dataset.o + '.pdf'));
      } catch (e) { BB.errorState(el, e); }
    })();

  </script>
</body>

</html>
