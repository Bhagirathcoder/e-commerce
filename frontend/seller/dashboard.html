<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seller Dashboard | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="row g-3" id="cards">
        <div class="loader"></div>
      </div>
      <h5 class="mt-4">Sales & stock overview</h5>
      <div id="an"></div>
      <div class="d-flex justify-content-end mt-2"><a href="/seller/analytics.html" class="btn btn-sm btn-navy">Full
          sales, stock & revenue report →</a></div>
      <div class="table-card mt-3">
        <h5>Recent orders</h5>
        <div id="ro"></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('SELLER', 'dashboard', 'Seller Dashboard')) {

      (async () => {
        BB.analyticsView($('#an'), '/api/seller', { days: 7, compact: true });
        try {
          const d = await BB.api('/api/seller/dashboard'); const s = BB.stat;
          $('#cards').innerHTML = s('bi-boxes', '#0f2742', 'Total Products', d.totalProducts) + s('bi-check2-circle', '#067d62', 'Active Products', d.activeProducts) + s('bi-hourglass-split', '#b45309', 'Pending Verification', d.pendingProducts) + s('bi-exclamation-octagon', '#c7222a', 'Out of Stock', d.outOfStock) + s('bi-box-seam', '#173a63', 'Total Orders', d.totalOrders) + s('bi-clock-history', '#fb8500', 'Pending Orders', d.pendingOrders) + s('bi-truck', '#067d62', 'Delivered Orders', d.deliveredOrders) + s('bi-currency-rupee', '#0a7ea4', 'Total Sales', BB.money(d.totalSales)) + s('bi-percent', '#7a1fa2', 'Commission (' + d.commissionPercent + '%)', BB.money(d.commission)) + s('bi-wallet2', '#067d62', 'Net Earnings', BB.money(d.netEarnings)) + s('bi-bank', '#173a63', 'Paid Out', BB.money(d.paidOut));
          const o = await BB.api('/api/seller/orders'); BB.table($('#ro'), [{ h: 'Order', f: x => '#' + x.id }, { h: 'Customer', f: x => BB.esc(x.customerName) }, { h: 'Items', f: x => x.items.map(i => BB.esc(i.name) + ' ×' + i.quantity).join('<br>') }, { h: 'Status', f: x => BB.badge(x.status) }, { h: 'Date', f: x => BB.dateOnly(x.createdAt) }], o.slice(0, 6), 'No orders yet');
        } catch (e) { BB.errorState($('#cards'), e); }
      })();
    }
  </script>
</body>

</html>
