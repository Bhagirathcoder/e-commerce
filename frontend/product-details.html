<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product details | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div id="pd">
      <div class="loader"></div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$, id = BB.qs('id'); let P;
    function delivery() { const d = new Date(); d.setDate(d.getDate() + 5); return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); }
    (async () => {
      await BB.init(); await BB.loadWish();
      try {
        P = await BB.api('/api/products/' + id); BB.viewed(P.id); document.title = P.name + ' | ByteBazaar';
        const imgs = P.images.length ? P.images : [BB.img(P)];
        const maxQ = Math.min(10, Math.max(P.stock, 1));
        $('#pd').innerHTML = `<nav class="small mb-2"><a href="/index.html">Home</a> › ${P.parentCategory ? `<a href="/products.html?category=${encodeURIComponent(P.parentCategory)}">${BB.esc(P.parentCategory)}</a> › ` : ''}<a href="/products.html?category=${encodeURIComponent(P.category)}">${BB.esc(P.category)}</a></nav>
    <div class="row g-4"><div class="col-lg-5"><div class="gallery"><div class="thumbs">${imgs.map((s, i) => `<img src="${s}" class="${i ? '' : 'on'}" data-i="${i}" alt="">`).join('')}</div><div class="zoom" id="zoom"><img id="mainImg" src="${imgs[0]}" alt="${BB.esc(P.name)}"></div></div></div>
    <div class="col-lg-4"><h1 class="h4">${BB.esc(P.name)}</h1><div class="mb-1">Brand: <a href="/products.html?brand=${encodeURIComponent(P.brand || '')}">${BB.esc(P.brand || '-')}</a> · Category: ${BB.esc(P.category)}</div>
      <div>${BB.stars(P.rating, P.reviewCount)} <a href="#reviews" class="small">${P.reviewCount} ratings</a> · <span class="verified-tag"><i class="bi bi-patch-check-fill"></i> ByteBazaar Verified</span></div><hr>
      ${P.discountPercent > 0 ? `<div><span class="off-badge" style="position:static" >-${P.discountPercent}%</span></div>` : ''}
      <div class="my-1"><span class="price" style="font-size:30px"><small>₹</small>${Number(P.finalPrice).toLocaleString('en-IN')}</span> ${P.discountPercent > 0 ? `<span class="mrp fs-6">M.R.P.: ${BB.money(P.price)}</span> <span class="text-danger fw-bold">(${P.discountPercent}% off)</span>` : ''}</div>
      <div class="small text-muted mb-2">Inclusive of offers · 5% tax added at checkout${P.onSale ? ' · <b class="text-danger">Festival Sale price</b>' : ''}</div>
      <ul class="small ps-3"><li><b>Seller:</b> ${BB.esc(P.sellerName)}</li><li><b>Warranty:</b> ${P.warrantyMonths > 0 ? P.warrantyMonths + ' months (certificate after delivery)' : 'No warranty'}</li><li><b>Returns:</b> ${P.returnable ? '7-day return after delivery' : 'Not returnable'}</li><li><b>SKU:</b> ${BB.esc(P.sku || '')}</li></ul>
      <h6 class="mt-3">About this item</h6><p style="white-space:pre-line">${BB.esc(P.description || 'No description provided.')}</p></div>
    <div class="col-lg-3"><div class="buybox"><div class="price"><small>₹</small>${Number(P.finalPrice).toLocaleString('en-IN')}</div>
      <div class="small my-2"><i class="bi bi-truck"></i> ${Number(P.finalPrice) >= 499 ? '<b class="text-success">FREE delivery</b>' : '₹40 delivery'} by <b>${delivery()}</b></div>
      <div class="mb-2 ${P.stock === 0 ? 'stock-out' : P.stock <= 5 ? 'stock-low' : 'stock-ok'}" style="font-size:18px">${P.stock === 0 ? 'Out of stock' : P.stock <= 5 ? 'Only ' + P.stock + ' left in stock' : 'In stock'}</div>
      <div class="d-flex align-items-center gap-2 mb-3"><label class="small">Quantity</label><select class="form-select form-select-sm w-auto" id="qty" ${P.stock === 0 ? 'disabled' : ''}>${Array.from({ length: maxQ }, (_, i) => `<option>${i + 1}</option>`).join('')}</select></div>
      <button class="btn btn-bb w-100 mb-2" id="addc" ${P.stock === 0 ? 'disabled' : ''}><i class="bi bi-cart-plus"></i> Add to Cart</button>
      <button class="btn btn-bb2 w-100 mb-2" id="buy" ${P.stock === 0 ? 'disabled' : ''}><i class="bi bi-lightning-charge-fill"></i> Buy Now</button>
      <button class="btn btn-outline-secondary w-100" id="wish"><i class="bi bi-heart"></i> Add to Wishlist</button>
      <div class="small text-muted mt-3"><i class="bi bi-shield-check"></i> Secure payments · COD & UPI<br><i class="bi bi-arrow-return-left"></i> ${P.returnable ? '7-day returns' : 'Non-returnable'}</div></div></div></div>
    <div class="section mt-4"><ul class="nav nav-tabs" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">Specifications</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2" id="revTab">Reviews (${P.reviewCount})</button></li></ul>
      <div class="tab-content pt-3"><div class="tab-pane fade show active" id="t1"><table class="spec-table w-100">${(P.specifications || '').split('\n').filter(Boolean).map(l => { const k = l.indexOf(':'); return k > 0 ? `<tr><td>${BB.esc(l.slice(0, k))}</td><td>${BB.esc(l.slice(k + 1))}</td></tr>` : `<tr><td colspan="2">${BB.esc(l)}</td></tr>` }).join('') || '<tr><td>No specifications listed</td></tr>'}</table></div>
      <div class="tab-pane fade" id="t2"><div id="reviews"><div class="loader"></div></div></div></div></div>
    <div class="section"><h2>You May Also Like — Related Products</h2><div id="rel"></div></div>
    <div class="section"><h2>Similar Products in ${BB.esc(P.category)}</h2><div id="sim"></div></div>`;
        BB.$$('.thumbs img').forEach(t => t.onclick = () => { BB.$$('.thumbs img').forEach(x => x.classList.remove('on')); t.classList.add('on'); $('#mainImg').src = t.src; });
        const z = $('#zoom'); z.onmouseenter = () => z.classList.add('zin'); z.onmouseleave = () => { z.classList.remove('zin'); $('#mainImg').style.transformOrigin = 'center'; }; z.onmousemove = e => { const r = z.getBoundingClientRect(); $('#mainImg').style.transformOrigin = ((e.clientX - r.left) / r.width * 100) + '% ' + ((e.clientY - r.top) / r.height * 100) + '%'; };
        $('#addc').onclick = () => BB.addCart(P.id, +$('#qty').value);
        $('#buy').onclick = () => { if (!BB.token()) { location.href = BB.loginUrl(); return; } location.href = `/checkout.html?buy=${P.id}&qty=${$('#qty').value}`; };
        const wb = $('#wish'); const paint = () => { }; wb.onclick = () => BB.toggleWish(P.id, null).then(() => { });
        BB.api('/api/products/related/' + P.id).then(l => BB.row($('#rel'), l)).catch(() => { });
        BB.api('/api/products/category/' + encodeURIComponent(P.category) + '?size=12').then(d => BB.row($('#sim'), d.items.filter(x => x.id !== P.id))).catch(() => { });
        BB.api('/api/products/' + P.id + '/reviews').then(r => {
          $('#reviews').innerHTML = r.length ? r.map(x => `<div class="review"><div>${BB.stars(x.rating)} <b>${BB.esc(x.title || '')}</b></div><div class="small text-muted">${BB.esc(x.userName)} · ${BB.dateOnly(x.createdAt)} ${x.verifiedPurchase ? '· <span class="vp">Verified Purchase</span>' : ''}</div><p class="mb-1 mt-1">${BB.esc(x.body || '')}</p>${x.images.map(s => `<img src="${BB.esc(s)}" alt="Customer photo" onclick="BB.modal('Customer photo','<img class=&quot;w-100&quot; src=&quot;${BB.esc(s)}&quot;>')">`).join('')}</div>`).join('') : '<div class="text-muted">No reviews yet. Only customers who received this product can review it.</div>';
        });
      } catch (e) { BB.errorState($('#pd'), e); }
    })();

  </script>
</body>

</html>
