<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Track order | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="bb-card mb-3">
      <h1 class="h4">Track your order</h1>
      <div class="row g-2">
        <div class="col-md-6"><select class="form-select" id="pick">
            <option value="">Select one of your orders…</option>
          </select></div>
        <div class="col-md-3"><input class="form-control" id="oid" placeholder="or enter Order ID" inputmode="numeric">
        </div>
        <div class="col-md-3"><button class="btn btn-bb w-100" id="go">Track</button></div>
      </div>
    </div>
    <div id="out"></div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$; const FLOW = ['PLACED', 'CONFIRMED', 'PROCESSING', 'SHIPPING', 'OUT_FOR_DELIVERY', 'DELIVERED'];
    async function track(id) {
      BB.loader($('#out'));
      try {
        const [o, tr] = await Promise.all([BB.api('/api/orders/' + id), BB.api('/api/orders/' + id + '/tracking')]);
        const seen = new Set(tr.map(t => t.status)); const pend = o.status === 'CANCELLED' ? [] : FLOW.filter(s => !seen.has(s) && s !== 'PROCESSING').map(s => s.replace(/_/g, ' '));
        $('#out').innerHTML = `<div class="row g-3"><div class="col-lg-5"><div class="bb-card"><h5>Order #${o.id} ${BB.badge(o.status)}</h5><table class="spec-table w-100"><tr><td>Product</td><td>${o.items.map(i => BB.esc(i.name)).join('<br>')}</td></tr><tr><td>Quantity</td><td>${o.items.reduce((a, i) => a + i.quantity, 0)}</td></tr><tr><td>Amount</td><td>${BB.money(o.total)}</td></tr><tr><td>Customer</td><td>${BB.esc(o.customerName)}</td></tr><tr><td>Delivery address</td><td>${BB.esc(o.shipAddress)}, ${BB.esc(o.shipCity)}, ${BB.esc(o.shipState)} - ${BB.esc(o.shipPin)}</td></tr><tr><td>Phone</td><td>${BB.esc(o.shipPhone)}</td></tr><tr><td>Order date</td><td>${BB.dt(o.createdAt)}</td></tr><tr><td>Estimated delivery</td><td>${o.estimatedDelivery ? BB.dateOnly(o.estimatedDelivery) : '-'}</td></tr></table></div></div><div class="col-lg-7"><div class="bb-card"><h5>Tracking timeline</h5>${BB.timeline(tr, pend)}</div></div></div>`;
      } catch (e) { BB.errorState($('#out'), e); }
    }
    (async () => {
      if (!await BB.init({ auth: true, roles: ['USER'] })) return;
      try { const l = await BB.api('/api/orders'); $('#pick').innerHTML += l.map(o => `<option value="${o.id}">#${o.id} · ${BB.dateOnly(o.createdAt)} · ${BB.esc(o.items[0]?.name || '')} (${o.status})</option>`).join(''); } catch { }
      $('#pick').onchange = () => { if ($('#pick').value) track($('#pick').value); };
      $('#go').onclick = () => { const v = $('#oid').value.trim() || $('#pick').value; if (v) track(v); };
      const q = BB.qs('id'); if (q) { $('#oid').value = q; track(q); }
    })();

  </script>
</body>

</html>
