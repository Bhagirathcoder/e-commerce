<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My reviews | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <h1 class="h4">Review your purchases</h1>
    <p class="text-muted">Only products you have received can be reviewed. Add a star rating and photos to help other
      shoppers.</p>
    <div class="bb-card" id="list">
      <div class="loader"></div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    (async () => {
      if (!await BB.init({ auth: true, roles: ['USER'] })) return; const el = BB.$('#list');
      try {
        const rows = []; (await BB.api('/api/orders')).filter(o => o.status === 'DELIVERED').forEach(o => o.items.forEach(i => rows.push({ o, i })));
        BB.table(el, [{ h: 'Product', f: r => '<a href="/product-details.html?id=' + r.i.productId + '">' + BB.esc(r.i.name) + '</a>' }, { h: 'Delivered', f: r => BB.dateOnly(r.o.deliveredAt) }, { h: '', f: r => r.i.reviewed ? '<span class="text-success"><i class="bi bi-check-circle"></i> Reviewed</span>' : '<a class="btn btn-sm btn-outline-warning" href="/order-details.html?id=' + r.o.id + '"><i class="bi bi-star"></i> Write a review</a>' }], rows, 'Nothing to review yet — delivered products will show up here.');
      } catch (e) { BB.errorState(el, e); }
    })();

  </script>
</body>

</html>
