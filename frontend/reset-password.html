<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="auth-wrap">
      <div class="logo-big"><img src="/images/logo.svg" alt="ByteBazaar"></div>
      <h4>Set a new password</h4>
      <form id="f"><input class="form-control mb-2" type="password" name="n" placeholder="New password" required><input
          class="form-control mb-2" type="password" name="c" placeholder="Confirm password" required>
        <div class="form-text mb-3">8+ characters with upper & lower case, a digit and a special character.</div><button
          class="btn btn-bb w-100" id="go">Update password</button>
      </form>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    (async () => {
      await BB.init(); const t = BB.qs('token'); if (!t) { BB.toast('Reset link is missing its token', 'err'); }
      BB.$('#f').onsubmit = async e => {
        e.preventDefault(); if (e.target.n.value !== e.target.c.value) return BB.toast('Passwords do not match', 'err'); BB.spin(BB.$('#go'), true);
        try { await BB.api('/api/auth/reset-password', { method: 'POST', body: { token: t, newPassword: e.target.n.value, confirmPassword: e.target.c.value } }); BB.toast('Password updated'); setTimeout(() => location.href = '/login.html', 900); } catch (x) { BB.fail(x); BB.spin(BB.$('#go'), false); }
      };
    })();

  </script>
</body>

</html>
