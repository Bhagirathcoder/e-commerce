<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sellers | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div><input class="form-control w-auto mb-3" id="q"
        placeholder="Search sellers…">
      <div class="table-card" id="t"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('ADMIN', 'sellers', 'Sellers')) {

      let all = []; const API = '/api/admin/sellers';
      async function load() { try { all = await BB.api(API); draw(); } catch (e) { BB.errorState($('#t'), e); } }
      function draw() {
        const q = ($('#q').value || '').toLowerCase(); const l = all.filter(u => !q || (u.fullName + u.email + u.phone).toLowerCase().includes(q));
        BB.table($('#t'), [{ h: 'ID', f: u => u.id }, { h: 'Name', f: u => BB.esc(u.fullName) }, { h: 'Email', f: u => BB.esc(u.email) }, { h: 'Phone', f: u => BB.esc(u.phone) }, { h: 'Products', f: u => u.products }, { h: 'Orders', f: u => u.orders }, { h: 'Sales', f: u => BB.money(u.sales) }, { h: 'Commission', f: u => BB.money(u.commission) }, { h: 'Status', f: u => BB.badge(u.status) }, { h: 'Created', f: u => BB.dateOnly(u.createdAt) }, { h: 'Actions', f: u => `<div class="d-flex gap-1 flex-wrap"><button class="btn btn-sm btn-outline-secondary" data-v="${u.id}">View</button><button class="btn btn-sm btn-outline-primary" data-e="${u.id}">Edit</button>${u.status === 'ACTIVE' ? `<button class="btn btn-sm btn-outline-warning" data-b="${u.id}">Block</button>` : `<button class="btn btn-sm btn-outline-success" data-u="${u.id}">Unblock</button>`}<button class="btn btn-sm btn-outline-danger" data-x="${u.id}">Delete</button></div>` }], l, 'No accounts found');
        BB.$$('[data-b]').forEach(b => b.onclick = () => act(b.dataset.b, 'block', 'Block this account? They will be logged out of every API immediately.'));
        BB.$$('[data-u]').forEach(b => b.onclick = () => act(b.dataset.u, 'unblock'));
        BB.$$('[data-x]').forEach(b => b.onclick = async () => { if (await BB.confirmBox('Delete this account permanently? (Accounts with order/product history cannot be deleted - block them instead.)', 'Delete')) { try { await BB.api(API + '/' + b.dataset.x, { method: 'DELETE' }); BB.toast('Deleted'); load(); } catch (e) { BB.fail(e); } } });
        BB.$$('[data-v]').forEach(b => b.onclick = () => { const u = all.find(x => x.id == b.dataset.v); BB.modal('Account #' + u.id, `<table class="spec-table w-100"><tr><td>Name</td><td>${BB.esc(u.fullName)}</td></tr><tr><td>Email</td><td>${BB.esc(u.email)}</td></tr><tr><td>Phone</td><td>${BB.esc(u.phone)}</td></tr><tr><td>Role</td><td>${u.role}</td></tr><tr><td>Status</td><td>${BB.badge(u.status)}</td></tr><tr><td>Orders</td><td>${u.orders}</td></tr><tr><td>Created</td><td>${BB.dt(u.createdAt)}</td></tr></table>`); });
        BB.$$('[data-e]').forEach(b => b.onclick = () => edit(all.find(x => x.id == b.dataset.e)));
      }
      async function act(id, what, msg) { if (msg && !await BB.confirmBox(msg, 'Yes, ' + what)) return; try { await BB.api(API + '/' + id + '/' + what, { method: 'PUT' }); BB.toast('Done'); load(); } catch (e) { BB.fail(e); } }
      function edit(u) {
        const m = BB.modal('Edit account', `<form id="ef" class="row g-2"><div class="col-12"><label class="form-label">Full name</label><input class="form-control" name="fullName" required value="${BB.esc(u.fullName)}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required value="${BB.esc(u.email)}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required pattern="[6-9][0-9]{9}" value="${BB.esc(u.phone)}"></div></form>`, { footer: '<button class="btn btn-bb" id="es">Save</button>' });
        $('#es', m.el).onclick = async () => { const f = $('#ef', m.el); if (!f.reportValidity()) return; try { await BB.api(API + '/' + u.id, { method: 'PUT', body: Object.fromEntries(new FormData(f)) }); m.close(); BB.toast('Saved'); load(); } catch (e) { BB.fail(e); } };
      }
      $('#q').oninput = draw; load();
    }
  </script>
</body>

</html>
