<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Commissions | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="dash">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="dash-main">
            <div class="dash-top" id="dash-top"></div>
            <div class="row g-3 mb-3" id="cards"></div>
            <div class="table-card mb-3">
                <form class="d-flex gap-2 align-items-center flex-wrap" id="rf"><b>Commission percentage</b><input
                        class="form-control w-auto" type="number" step="0.5" min="0" max="50" id="pct"><button
                        class="btn btn-bb">Update rate</button><span class="small text-muted">Applies to future
                        deliveries. Calculated on the backend per order item.</span></form>
            </div>
            <div class="table-card" id="t"></div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="/js/dash.js"></script>
    <script>
        const $ = BB.$;
        if (BB.dash('ADMIN', 'commissions', 'Commissions')) {

            async function load() {
                try {
                    const [d, l] = await Promise.all([BB.api('/api/admin/dashboard'), BB.api('/api/admin/commissions')]); const s = BB.stat;
                    $('#cards').innerHTML = s('bi-currency-rupee', '#0a7ea4', 'Total Sales', BB.money(d.totalSales)) + s('bi-percent', '#7a1fa2', 'Total Commission', BB.money(d.totalCommission)) + s('bi-bank', '#067d62', 'Seller Payout (paid)', BB.money(d.sellerPayout)) + s('bi-clock-history', '#b45309', 'Pending Commission', BB.money(d.pendingCommission)); $('#pct').value = d.commissionPercent;
                    BB.table($('#t'), [{ h: '#', f: c => c.id }, { h: 'Seller', f: c => BB.esc(c.sellerName) }, { h: 'Order', f: c => '#' + c.orderId }, { h: 'Product', f: c => BB.esc(c.productName) }, { h: 'Sale', f: c => BB.money(c.saleAmount) }, { h: '%', f: c => c.commissionPct + '%' }, { h: 'Admin commission', f: c => BB.money(c.commissionAmount) }, { h: 'Seller amount', f: c => BB.money(c.sellerAmount) }, { h: 'Payment', f: c => BB.badge(c.paymentStatus) }, { h: 'Date', f: c => BB.dateOnly(c.createdAt) }, { h: '', f: c => c.paymentStatus === 'PENDING' ? `<button class="btn btn-sm btn-success" data-p="${c.id}">Mark paid</button>` : '' }], l, 'No commission records yet — they are created when orders are delivered.');
                    BB.$$('[data-p]').forEach(b => b.onclick = async () => { try { await BB.api('/api/admin/commissions/' + b.dataset.p + '/paid', { method: 'PUT' }); BB.toast('Marked paid'); load(); } catch (e) { BB.fail(e); } });
                } catch (e) { BB.errorState($('#t'), e); }
            }
            $('#rf').onsubmit = async e => { e.preventDefault(); try { await BB.api('/api/admin/settings/commission', { method: 'PUT', body: { percent: +$('#pct').value } }); BB.toast('Commission rate updated'); load(); } catch (x) { BB.fail(x); } };
            load();
        }
    </script>
</body>

</html>
