<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="table-card" id="t">
        <div class="loader"></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('SELLER', 'orders', 'Orders')) {

      const NEXT = { PLACED: ['CONFIRMED', 'PROCESSING', 'SHIPPING', 'OUT_FOR_DELIVERY', 'DELIVERED'], CONFIRMED: ['PROCESSING', 'SHIPPING', 'OUT_FOR_DELIVERY', 'DELIVERED'], PROCESSING: ['SHIPPING', 'OUT_FOR_DELIVERY', 'DELIVERED'], SHIPPING: ['OUT_FOR_DELIVERY', 'DELIVERED'], OUT_FOR_DELIVERY: ['DELIVERED'] };
      let all = [];
      async function load() {
        try {
          all = await BB.api('/api/seller/orders');
          BB.table($('#t'), [{ h: 'Order ID', f: o => '#' + o.id }, { h: 'Customer', f: o => BB.esc(o.customerName) }, { h: 'Email / Phone', f: o => BB.esc(o.customerEmail) + '<br><small>' + BB.esc(o.customerPhone) + '</small>' }, { h: 'Product', f: o => o.items.map(i => BB.esc(i.name)).join('<br>') }, { h: 'Qty', f: o => o.items.reduce((a, i) => a + i.quantity, 0) }, { h: 'Amount', f: o => BB.money(o.items.reduce((a, i) => a + Number(i.lineTotal), 0)) }, { h: 'Delivery address', f: o => '<small>' + BB.esc(o.shipAddress) + ', ' + BB.esc(o.shipCity) + ', ' + BB.esc(o.shipState) + ' - ' + BB.esc(o.shipPin) + '</small>' }, { h: 'Date', f: o => BB.dateOnly(o.createdAt) }, { h: 'Payment', f: o => o.paymentMethod + '<br>' + BB.badge(o.paymentStatus) }, { h: 'Status', f: o => BB.badge(o.status) },
          { h: 'Actions', f: o => `<div class="d-flex gap-1 flex-wrap">${NEXT[o.status] && !(o.paymentMethod === 'UPI' && o.paymentStatus !== 'SUCCESS') ? `<button class="btn btn-sm btn-bb" data-u="${o.id}">Update status</button>` : (o.paymentMethod === 'UPI' && o.paymentStatus !== 'SUCCESS' && o.status === 'PLACED' ? '<small class="text-muted">Awaiting payment</small>' : '')}<button class="btn btn-sm btn-outline-secondary" data-i="${o.id}"><i class="bi bi-file-earmark-pdf"></i></button></div>` }], all, 'No orders for your products yet.');
          BB.$$('[data-u]').forEach(b => b.onclick = () => { const o = all.find(x => x.id == b.dataset.u); BB.statusModal(o, NEXT[o.status], '/api/seller', load); });
          BB.$$('[data-i]').forEach(b => b.onclick = () => BB.download('/api/orders/' + b.dataset.i + '/invoice', 'ByteBazaar-Order-' + b.dataset.i + '.pdf'));
        } catch (e) { BB.errorState($('#t'), e); }
      }
      load();
    }
  </script>
</body>

</html>
