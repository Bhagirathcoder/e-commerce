<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Orders | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h1 class="h4 mb-0">Your Orders</h1><select class="form-select w-auto" id="flt">
        <option value="">All orders</option>
        <option>PLACED</option>
        <option>CONFIRMED</option>
        <option>SHIPPING</option>
        <option>OUT_FOR_DELIVERY</option>
        <option>DELIVERED</option>
        <option>CANCELLED</option>
      </select>
    </div>
    <div id="list">
      <div class="loader"></div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$; let all = [];
    function draw() {
      const f = $('#flt').value, l = all.filter(o => !f || o.status === f);
      if (!l.length) return BB.empty($('#list'), '📦', 'No orders to show', 'When you buy something, it will appear here.', '<a class="btn btn-bb" href="/products.html">Start shopping</a>');
      $('#list').innerHTML = l.map(o => `<div class="bb-card mb-3"><div class="d-flex flex-wrap justify-content-between gap-2 pb-2 mb-2 border-bottom small"><div><div class="text-muted">ORDER PLACED</div>${BB.dateOnly(o.createdAt)}</div><div><div class="text-muted">TOTAL</div>${BB.money(o.total)}</div><div><div class="text-muted">PAYMENT</div>${o.paymentMethod} · ${BB.badge(o.paymentStatus)}</div><div class="text-end"><div class="text-muted">ORDER #${o.id}</div>${BB.badge(o.status)}</div></div>
   ${o.items.map(i => `<div class="d-flex gap-3 mb-2"><img src="${BB.src(i.image, i.name)}" width="70" height="70" style="object-fit:contain;background:#f6f8fb;border-radius:8px"><div class="flex-grow-1"><a class="fw-semibold" href="/product-details.html?id=${i.productId}">${BB.esc(i.name)}</a><div class="small text-muted">Qty ${i.quantity} · ${BB.money(i.lineTotal)}</div></div></div>`).join('')}
   <div class="d-flex flex-wrap gap-2 mt-2"><a class="btn btn-bb btn-sm" href="/order-details.html?id=${o.id}">Order details</a><a class="btn btn-outline-secondary btn-sm" href="/track-order.html?id=${o.id}"><i class="bi bi-geo-alt"></i> Track</a><button class="btn btn-outline-secondary btn-sm" data-inv="${o.id}"><i class="bi bi-file-earmark-pdf"></i> Invoice</button>${o.paymentMethod === 'UPI' && o.paymentStatus === 'PENDING' && o.status === 'PLACED' ? `<a class="btn btn-bb2 btn-sm" href="/payment.html?order=${o.id}">Pay now</a>` : ''}</div></div>`).join('');
      BB.$$('[data-inv]').forEach(b => b.onclick = () => BB.download('/api/orders/' + b.dataset.inv + '/invoice', 'ByteBazaar-Invoice-' + b.dataset.inv + '.pdf'));
    }
    (async () => { if (!await BB.init({ auth: true, roles: ['USER'] })) return; try { all = await BB.api('/api/orders'); draw(); $('#flt').onchange = draw; } catch (e) { BB.errorState($('#list'), e); } })();

  </script>
</body>

</html>
