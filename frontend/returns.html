<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Returns | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <h1 class="h4">Your Returns</h1>
    <div id="list">
      <div class="loader"></div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$; const STEPS = ['REQUESTED', 'APPROVED', 'PICKUP_SCHEDULED', 'PICKED_UP', 'RECEIVED', 'PRODUCT_ANALYSIS', 'REFUND_INITIATED', 'REFUNDED'];
    const LBL = { REQUESTED: 'Return Requested', APPROVED: 'Return Approved', PICKUP_SCHEDULED: 'Pickup Scheduled', PICKED_UP: 'Product Picked Up', RECEIVED: 'Received by Delivery Team', PRODUCT_ANALYSIS: 'Product Analysis', REFUND_INITIATED: 'Refund Approved / Initiated', REFUNDED: 'Refund Completed', REJECTED: 'Return Rejected' };
    async function load() {
      try {
        const l = await BB.api('/api/returns'); if (!l.length) return BB.empty($('#list'), '↩️', 'No return requests', 'You can return eligible items within 7 days of delivery from Order Details.', '<a class="btn btn-bb" href="/orders.html">Go to orders</a>');
        $('#list').innerHTML = l.map(r => `<div class="bb-card mb-3" id="r${r.id}"><div class="d-flex gap-3 flex-wrap"><img src="${BB.src(r.productImage, r.productName)}" width="72" height="72" style="object-fit:contain;background:#f6f8fb;border-radius:8px"><div class="flex-grow-1"><div class="fw-semibold">${BB.esc(r.productName)}</div><div class="small text-muted">Return #${r.id} · Order #${r.orderId} · ${BB.dt(r.requestedAt)}</div><div class="small">Reason: ${BB.esc(r.reason)}${r.comment ? ' — ' + BB.esc(r.comment) : ''}</div>${r.refundAmount ? `<div class="small">Refund: <b>${BB.money(r.refundAmount)}</b></div>` : ''}</div><div>${BB.badge(r.status)}<div><button class="btn btn-sm btn-outline-secondary mt-2" data-t="${r.id}">Track return</button></div></div></div><div class="mt-3" id="t${r.id}" style="display:none"></div></div>`).join('');
        BB.$$('[data-t]').forEach(b => b.onclick = () => toggle(b.dataset.t));
        const q = BB.qs('id'); if (q && document.getElementById('r' + q)) toggle(q);
      } catch (e) { BB.errorState($('#list'), e); }
    }
    async function toggle(id) {
      const box = $('#t' + id); if (box.style.display === 'block') { box.style.display = 'none'; return; } box.style.display = 'block'; BB.loader(box);
      try {
        const t = await BB.api('/api/returns/' + id + '/tracking'); const seen = new Set(t.map(x => x.status)); const rej = seen.has('REJECTED');
        box.innerHTML = BB.timeline(t.map(x => ({ status: LBL[x.status] || x.status, eventTime: x.eventTime, description: x.description })), rej ? [] : STEPS.filter(s => !seen.has(s)).map(s => LBL[s]));
      }
      catch (e) { BB.errorState(box, e); }
    }
    (async () => { if (await BB.init({ auth: true, roles: ['USER'] })) load(); })();

  </script>
</body>

</html>
