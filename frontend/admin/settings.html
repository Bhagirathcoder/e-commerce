<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="dash">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="dash-main">
            <div class="dash-top" id="dash-top"></div>
            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="table-card">
                        <h5>Commission</h5>
                        <p class="small text-muted">Current seller commission percentage.</p>
                        <div class="input-group" style="max-width:260px"><input class="form-control" type="number"
                                id="pct" step="0.5" min="0" max="50"><span class="input-group-text">%</span><button
                                class="btn btn-bb" id="sp">Save</button></div>
                    </div>
                    <div class="table-card mt-3">
                        <h5>AI support</h5>
                        <p class="small mb-0">The bundled assistant answers from the database. To plug in an LLM,
                            implement <code>AiSupportService</code> and set the <code>AI_API_KEY</code> environment
                            variable on the server — keys are never stored in the code or the browser.</p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="table-card">
                        <h5>Categories & brands</h5>
                        <form class="row g-2 mb-3" id="cf">
                            <div class="col-md-5"><input class="form-control" id="cn" placeholder="Category name"
                                    required></div>
                            <div class="col-md-4"><select class="form-select" id="cp">
                                    <option value="">Top-level category</option>
                                </select></div>
                            <div class="col-md-3"><button class="btn btn-bb w-100">Add</button></div>
                        </form>
                        <div id="ct"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="/js/dash.js"></script>
    <script>
        const $ = BB.$;
        if (BB.dash('ADMIN', 'settings', 'Settings')) {

            async function load() {
                try {
                    const [d, c] = await Promise.all([BB.api('/api/admin/dashboard'), BB.api('/api/categories')]); $('#pct').value = d.commissionPercent;
                    $('#cp').innerHTML = '<option value="">Top-level category</option>' + c.map(x => `<option value="${x.id}">Sub-category of ${BB.esc(x.name)}</option>`).join('');
                    $('#ct').innerHTML = c.map(x => `<div class="mb-2"><b>${BB.esc(x.name)}</b> <button class="btn btn-sm btn-link text-danger" data-x="${x.id}">delete</button><div class="ms-3">${x.children.map(k => `<span class="badge text-bg-light border me-1 mb-1">${BB.esc(k.name)} <a href="#" class="text-danger" data-x="${k.id}">×</a></span>`).join('')}</div></div>`).join('');
                    BB.$$('[data-x]').forEach(b => b.onclick = async e => { e.preventDefault(); if (await BB.confirmBox('Delete this category?', 'Delete')) { try { await BB.api('/api/admin/categories/' + b.dataset.x, { method: 'DELETE' }); load(); } catch (x) { BB.fail(x); } } });
                } catch (e) { BB.fail(e); }
            }
            $('#sp').onclick = async () => { try { await BB.api('/api/admin/settings/commission', { method: 'PUT', body: { percent: +$('#pct').value } }); BB.toast('Commission updated'); } catch (e) { BB.fail(e); } };
            $('#cf').onsubmit = async e => { e.preventDefault(); try { await BB.api('/api/admin/categories', { method: 'POST', body: { name: $('#cn').value, parentId: $('#cp').value ? +$('#cp').value : null } }); $('#cn').value = ''; BB.toast('Category added'); load(); } catch (x) { BB.fail(x); } };
            load();
        }
    </script>
</body>

</html>
