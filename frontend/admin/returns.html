<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Returns | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="table-card" id="t"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('ADMIN', 'returns', 'Returns')) {

      let all = [];
      const NEXT = { REQUESTED: [['APPROVED', 'Approve', 'success'], ['REJECTED', 'Reject', 'outline-danger']], APPROVED: [['PICKUP_SCHEDULED', 'Schedule pickup', 'bb']], PICKUP_SCHEDULED: [['PICKED_UP', 'Mark picked up', 'bb']], PICKED_UP: [['RECEIVED', 'Mark received', 'bb']], RECEIVED: [['PRODUCT_ANALYSIS', 'Start product analysis', 'bb']], PRODUCT_ANALYSIS: [['REFUND_INITIATED', 'Approve & initiate refund', 'success'], ['REJECTED', 'Reject return', 'outline-danger']] };
      async function load() { try { all = await BB.api('/api/admin/returns'); draw(); } catch (e) { BB.errorState($('#t'), e); } }
      function draw() {
        BB.table($('#t'), [{ h: '#', f: r => r.id }, { h: 'Order', f: r => '#' + r.orderId }, { h: 'Product', f: r => BB.esc(r.productName) }, { h: 'Customer', f: r => BB.esc(r.customer) }, { h: 'Reason', f: r => BB.esc(r.reason) + (r.comment ? '<br><small class="text-muted">' + BB.esc(r.comment) + '</small>' : '') + (r.images.length ? '<br>' + r.images.map(s => `<a href="${BB.esc(s)}" target="_blank"><img class="timg" src="${BB.esc(s)}"></a>`).join(' ') : '') }, { h: 'Requested', f: r => BB.dt(r.requestedAt) }, { h: 'Status', f: r => BB.badge(r.status) },
        { h: 'Actions', f: r => `<div class="d-flex gap-1 flex-wrap"><button class="btn btn-sm btn-outline-secondary" data-t="${r.id}">Tracking</button>${(NEXT[r.status] || []).map((n, i) => `<button class="btn btn-sm btn-${n[2]}" data-s="${r.id}" data-n="${i}">${n[1]}</button>`).join('')}</div>` }], all, 'No return requests');
        BB.$$('[data-t]').forEach(b => b.onclick = () => { const r = all.find(x => x.id == b.dataset.t); BB.modal('Return #' + r.id + ' tracking', BB.timeline(r.tracking.map(t => ({ status: t.status, eventTime: t.eventTime, description: t.description }))) + (r.analysisNote ? '<div class="alert alert-secondary mt-2"><b>Analysis:</b> ' + BB.esc(r.analysisNote) + '</div>' : '')); });
        BB.$$('[data-s]').forEach(b => b.onclick = () => step(all.find(x => x.id == b.dataset.s), NEXT[all.find(x => x.id == b.dataset.s).status][+b.dataset.n]));
      }
      function step(r, n) {
        const needNote = r.status === 'PRODUCT_ANALYSIS'; const ask = needNote || n[0] === 'REJECTED' || n[0] === 'PICKUP_SCHEDULED';
        const go = async note => { try { await BB.api('/api/admin/returns/' + r.id + '/status', { method: 'PUT', body: { status: n[0], note } }); BB.toast('Return updated'); load(); } catch (e) { BB.fail(e); } };
        if (!ask) return go('');
        const m = BB.modal(n[1], `${needNote ? '<p class="small text-muted">Record the product analysis: condition, original product, damage, accessories, packaging and warranty.</p>' : ''}<textarea class="form-control" id="nt" rows="4" ${needNote || n[0] === 'REJECTED' ? 'required' : ''} placeholder="${n[0] === 'PICKUP_SCHEDULED' ? 'Pickup date/time (optional)' : 'Notes'}"></textarea>`, { footer: '<button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-bb" id="ok">Confirm</button>' });
        $('#ok', m.el).onclick = () => { const v = $('#nt', m.el).value.trim(); if ((needNote || n[0] === 'REJECTED') && !v) return BB.toast('Please add a note', 'err'); m.close(); go(v); };
      }
      load();
    }
  </script>
</body>

</html>
