<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Your Products | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="d-flex justify-content-between mb-3 flex-wrap gap-2"><input class="form-control w-auto" id="sq"
          placeholder="Search my products…"><button class="btn btn-bb" id="add"><i class="bi bi-plus-lg"></i> Add
          Product</button></div>
      <div class="table-card" id="t">
        <div class="loader"></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dash.js"></script>
  <script>
    const $ = BB.$;
    if (BB.dash('SELLER', 'manage-products', 'Manage Your Products')) {

      let all = [];
      const vs = { VERIFIED: 'VERIFIED', PENDING_VERIFICATION: 'PENDING_VERIFICATION', REJECTED: 'REJECTED' };
      function draw() {
        const q = ($('#sq').value || '').toLowerCase(); const l = all.filter(p => !q || (p.name + p.brand + p.sku + p.category).toLowerCase().includes(q));
        BB.table($('#t'), [{ h: 'ID', f: p => p.id }, { h: 'Image', f: p => `<img class="timg" src="${BB.img(p)}">` }, { h: 'Product', f: p => `<div class="fw-semibold">${BB.esc(p.name)}</div><small class="text-muted">${BB.esc(p.sku || '')}</small>` }, { h: 'Category', f: p => BB.esc(p.category) }, { h: 'Brand', f: p => BB.esc(p.brand || '-') }, { h: 'Price', f: p => BB.money(p.finalPrice) + (p.discountPercent ? `<div class="small text-muted"><s>${BB.money(p.price)}</s> -${p.discountPercent}%</div>` : '') }, { h: 'Stock', f: p => p.stock === 0 ? '<span class="stock-out">0</span>' : p.stock }, { h: 'Rating', f: p => BB.stars(p.rating, p.reviewCount) }, { h: 'Verification', f: p => BB.badge(p.verification) }, { h: 'Status', f: p => BB.badge(p.active ? 'ACTIVE' : 'BLOCKED').replace('BLOCKED', 'INACTIVE') },
        { h: 'Actions', f: p => `<div class="d-flex gap-1 flex-wrap"><a class="btn btn-sm btn-outline-secondary" href="/product-details.html?id=${p.id}">View</a><button class="btn btn-sm btn-outline-primary" data-e="${p.id}">Edit</button><button class="btn btn-sm btn-outline-${p.active ? 'warning' : 'success'}" data-a="${p.id}" data-v="${!p.active}">${p.active ? 'Deactivate' : 'Activate'}</button><button class="btn btn-sm btn-outline-danger" data-d="${p.id}">Delete</button></div>` }], l, 'You have not added any products yet.');
        BB.$$('[data-e]').forEach(b => b.onclick = () => edit(+b.dataset.e));
        BB.$$('[data-a]').forEach(b => b.onclick = async () => { try { await BB.api('/api/seller/products/' + b.dataset.a + '/active?value=' + b.dataset.v, { method: 'PUT' }); load(); } catch (e) { BB.fail(e); } });
        BB.$$('[data-d]').forEach(b => b.onclick = async () => { if (await BB.confirmBox('Are you sure you want to delete this product?', 'Delete')) { try { await BB.api('/api/seller/products/' + b.dataset.d, { method: 'DELETE' }); BB.toast('Product deleted'); load(); } catch (e) { BB.fail(e); } } });
      }
      const edit = id => BB.productForm(all.find(p => p.id === id), { onSaved: load });
      async function load() { try { all = await BB.api('/api/seller/products'); draw(); } catch (e) { BB.errorState($('#t'), e); } }
      $('#add').onclick = () => BB.productForm(null, { onSaved: load }); $('#sq').oninput = draw;
      load().then(() => { if (BB.qs('add')) BB.productForm(null, { onSaved: load }); const ed = BB.qs('edit'); if (ed && all.find(p => p.id == ed)) edit(+ed); });
    }
  </script>
</body>

</html>
