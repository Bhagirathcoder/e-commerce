<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="bb-card">
      <h1 class="h4">My Wishlist</h1>
      <div id="list">
        <div class="loader"></div>
      </div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$;
    async function load() {
      try {
        const l = await BB.api('/api/wishlist'); BB.setCount('#wishCount', l.length);
        if (!l.length) return BB.empty($('#list'), '💝', 'Your wishlist is empty', 'Tap the heart on any product to save it here.', '<a class="btn btn-bb" href="/products.html">Explore products</a>');
        $('#list').innerHTML = l.map(p => `<div class="cart-row"><a href="/product-details.html?id=${p.id}"><img class="cimg" src="${BB.img(p)}"></a><div class="flex-grow-1"><a class="fw-semibold" href="/product-details.html?id=${p.id}">${BB.esc(p.name)}</a><div>${BB.stars(p.rating, p.reviewCount)}</div><div><b>${BB.money(p.finalPrice)}</b> ${p.discountPercent ? `<span class="mrp">${BB.money(p.price)}</span>` : ''}</div><div class="${p.stock ? 'stock-ok' : 'stock-out'} small">${p.stock ? (p.stock <= 5 ? 'Only ' + p.stock + ' left' : 'In stock') : 'Out of stock'}</div>
      <div class="d-flex gap-2 flex-wrap mt-2"><button class="btn btn-bb btn-sm" ${p.stock ? '' : 'disabled'} data-c="${p.id}">Move to Cart</button><button class="btn btn-bb2 btn-sm" ${p.stock ? '' : 'disabled'} data-b="${p.id}">Buy Now</button><a class="btn btn-outline-secondary btn-sm" href="/product-details.html?id=${p.id}">View</a><button class="btn btn-outline-danger btn-sm" data-r="${p.id}"><i class="bi bi-trash"></i> Remove</button></div></div></div>`).join('');
        BB.$$('[data-c]').forEach(b => b.onclick = async () => { await BB.addCart(+b.dataset.c); try { await BB.api('/api/wishlist/' + b.dataset.c, { method: 'DELETE' }); } catch { } load(); });
        BB.$$('[data-b]').forEach(b => b.onclick = () => location.href = '/checkout.html?buy=' + b.dataset.b + '&qty=1');
        BB.$$('[data-r]').forEach(b => b.onclick = async () => { try { await BB.api('/api/wishlist/' + b.dataset.r, { method: 'DELETE' }); load(); } catch (e) { BB.fail(e); } });
      } catch (e) { BB.errorState($('#list'), e); }
    }
    (async () => { if (await BB.init({ auth: true, roles: ['USER'] })) load(); })();

  </script>
</body>

</html>
