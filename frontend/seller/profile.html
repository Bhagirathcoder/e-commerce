<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Profile | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="dash">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="dash-main">
            <div class="dash-top" id="dash-top"></div>
            <div class="table-card" id="pf">
                <div class="loader"></div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/dash.js"></script>
    <script>
        const $ = BB.$;
        if (BB.dash('SELLER', 'profile', 'My Profile')) {

            (async () => { try { const u = await BB.api('/api/auth/me'); localStorage.setItem('bb_user', JSON.stringify(u)); BB.profileForm($('#pf'), u, true); } catch (e) { BB.errorState($('#pf'), e); } })();
        }
    </script>
</body>

</html>
