<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
      <h1 class="h4 mb-0 flex-grow-1" id="ttl">All products</h1>
      <button class="btn btn-navy d-lg-none" data-bs-toggle="collapse" data-bs-target="#filters"><i
          class="bi bi-funnel"></i> Filters</button>
      <select class="form-select w-auto" id="sort">
        <option value="relevance">Sort: Relevance</option>
        <option value="priceAsc">Price: Low → High</option>
        <option value="priceDesc">Price: High → Low</option>
        <option value="newest">Newest</option>
        <option value="rating">Best Rating</option>
        <option value="popular">Most Popular</option>
        <option value="discount">Biggest Discount</option>
      </select>
    </div>
    <div class="row g-3">
      <div class="col-lg-3">
        <div class="collapse d-lg-block" id="filters">
          <div class="filter-box" id="fbox"></div>
        </div>
      </div>
      <div class="col-lg-9">
        <div id="res">
          <div class="loader"></div>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$; const P = new URLSearchParams(location.search); let page = +(P.get('page') || 1);
    const PRICE = [['', 'Any price'], ['0-500', '₹0 - ₹500'], ['500-1000', '₹500 - ₹1,000'], ['1000-5000', '₹1,000 - ₹5,000'], ['5000-', '₹5,000+']];
    function radios(name, opts, cur) { return opts.map(o => `<div class="form-check"><input class="form-check-input" type="radio" name="${name}" id="${name}${o[0]}" value="${o[0]}" ${String(cur || '') === o[0] ? 'checked' : ''}><label class="form-check-label" for="${name}${o[0]}">${o[1]}</label></div>`).join(''); }
    async function buildFilters() {
      const [cats, brands] = await Promise.all([BB.api('/api/categories'), BB.api('/api/brands')]);
      const pr = (P.get('minPrice') || '') + (P.get('minPrice') || P.get('maxPrice') ? '-' : '') + (P.get('maxPrice') || '');
      $('#fbox').innerHTML = `<h6>Category</h6><select class="form-select form-select-sm" name="category"><option value="">All categories</option>${cats.map(c => `<optgroup label="${BB.esc(c.name)}"><option value="${BB.esc(c.name)}">All ${BB.esc(c.name)}</option>${c.children.map(k => `<option value="${BB.esc(k.name)}">${BB.esc(k.name)}</option>`).join('')}</optgroup>`).join('')}</select>
  <h6>Brand</h6><select class="form-select form-select-sm" name="brand"><option value="">All brands</option>${brands.map(b => `<option>${BB.esc(b)}</option>`).join('')}</select>
  <h6>Price</h6>${radios('price', PRICE, pr)}
  <h6>Customer rating</h6>${radios('minRating', [['', 'Any'], ['5', '5 Star'], ['4', '4★ & up'], ['3', '3★ & up']], P.get('minRating'))}
  <h6>Availability</h6>${radios('inStock', [['', 'All'], ['true', 'In Stock'], ['false', 'Out of Stock']], P.get('inStock'))}
  <h6>Discount</h6>${radios('minDiscount', [['', 'Any'], ['10', '10% or more'], ['20', '20% or more'], ['30', '30% or more'], ['50', '50% or more']], P.get('minDiscount'))}
  <button class="btn btn-sm btn-outline-secondary mt-3 w-100" id="clr">Clear all filters</button>`;
      $('[name=category]').value = P.get('category') || ''; $('[name=brand]').value = P.get('brand') || '';
      BB.$$('#fbox input,#fbox select').forEach(i => i.onchange = apply);
      $('#clr').onclick = () => { const q = P.get('q'); location.href = '/products.html' + (q ? '?q=' + encodeURIComponent(q) : ''); };
    }
    function apply() {
      const n = new URLSearchParams(); const q = P.get('q'); if (q) n.set('q', q);
      const g = k => (document.querySelector(`[name=${k}]`) || {}).value; const r = k => (document.querySelector(`[name=${k}]:checked`) || {}).value;
      if (g('category')) n.set('category', g('category')); if (g('brand')) n.set('brand', g('brand'));
      const pr = r('price'); if (pr) { const [a, b] = pr.split('-'); if (a) n.set('minPrice', a); if (b) n.set('maxPrice', b); }
      ['minRating', 'inStock', 'minDiscount'].forEach(k => { if (r(k)) n.set(k, r(k)); }); n.set('sort', $('#sort').value);
      location.href = '/products.html?' + n.toString();
    }
    async function load() {
      $('#sort').value = P.get('sort') || 'relevance'; $('#sort').onchange = apply;
      const f = ['q', 'category', 'brand', 'minPrice', 'maxPrice', 'minRating', 'inStock', 'minDiscount', 'sort'], n = new URLSearchParams(); f.forEach(k => P.get(k) && n.set(k, P.get(k))); n.set('page', page); n.set('size', 20);
      const q = P.get('q'), c = P.get('category'); $('#ttl').innerHTML = q ? `Results for “${BB.esc(q)}”` : c ? BB.esc(c) : 'All products';
      try {
        const d = await BB.api('/api/products?' + n.toString());
        $('#res').innerHTML = d.items.length ? `<div class="text-muted small mb-2">${d.total} result${d.total === 1 ? '' : 's'}${q ? ' — best matches first, followed by related products' : ''}</div><div class="pgrid">${d.items.map(BB.card).join('')}</div>` : '';
        if (!d.items.length) BB.empty($('#res'), '🔍', 'No products found', 'Try a different search or clear some filters.', '<a class="btn btn-bb" href="/products.html">Browse all products</a>');
        $('#pager').innerHTML = d.totalPages > 1 ? Array.from({ length: d.totalPages }, (_, i) => `<button class="${i + 1 === page ? 'on' : ''}" data-p="${i + 1}">${i + 1}</button>`).join('') : '';
        BB.$$('#pager button').forEach(b => b.onclick = () => { P.set('page', b.dataset.p); location.href = '/products.html?' + P.toString(); });
      } catch (e) { BB.errorState($('#res'), e); }
    }
    (async () => { await BB.init(); await BB.loadWish(); await buildFilters(); load(); })();

  </script>
</body>

</html>
