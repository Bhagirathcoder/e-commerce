<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <h1 class="h4 mb-3">Checkout</h1>
    <div class="row g-3">
      <div class="col-lg-8">
        <div class="bb-card mb-3">
          <h5>1. Delivery address</h5>
          <form id="addr" class="row g-2">
            <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="shipName"
                required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="shipPhone"
                required pattern="[6-9][0-9]{9}" title="10-digit mobile number"></div>
            <div class="col-12"><label class="form-label">House / Street</label><input class="form-control"
                name="shipAddress" required></div>
            <div class="col-md-3"><label class="form-label">City</label><input class="form-control" name="shipCity"
                required></div>
            <div class="col-md-3"><label class="form-label">District</label><input class="form-control"
                name="shipDistrict"></div>
            <div class="col-md-3"><label class="form-label">State</label><input class="form-control" name="shipState"
                required></div>
            <div class="col-md-3"><label class="form-label">PIN code</label><input class="form-control" name="shipPin"
                required pattern="[0-9]{6}" title="6-digit PIN"></div>
          </form>
        </div>
        <div class="bb-card mb-3">
          <h5>2. Payment method</h5><label class="pay-option on" id="pCOD"><input type="radio" name="pm" value="COD"
              checked><i class="bi bi-cash-stack fs-3"></i>
            <div><b>Cash on Delivery</b>
              <div class="small text-muted">Pay when your order arrives</div>
            </div>
          </label><label class="pay-option" id="pUPI"><input type="radio" name="pm" value="UPI"><i
              class="bi bi-qr-code fs-3"></i>
            <div><b>UPI Payment</b>
              <div class="small text-muted">Pay with any UPI app. Order confirms after server-side payment verification.
              </div>
            </div>
          </label>
        </div>
        <div class="bb-card">
          <h5>3. Review items</h5>
          <div id="items">
            <div class="loader"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="bb-card" style="position:sticky;top:130px">
          <h6>Order Summary</h6>
          <div id="sum"></div><button class="btn btn-bb w-100 mt-3" id="place">Place Order</button>
          <div class="small text-muted mt-2">Totals are recalculated on the server when you place the order.</div>
        </div>
      </div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>

    const $ = BB.$, buy = BB.qs('buy'), qty = +(BB.qs('qty') || 1); let lines = [];
    (async () => {
      if (!await BB.init({ auth: true, roles: ['USER'] })) return;
      const u = BB.user(); const f = $('#addr'); f.shipName.value = u.fullName || ''; f.shipPhone.value = u.phone || ''; f.shipAddress.value = u.address || ''; f.shipCity.value = u.city || ''; f.shipState.value = u.state || ''; f.shipPin.value = u.pin || '';
      BB.$$('input[name=pm]').forEach(r => r.onchange = () => { $('#pCOD').classList.toggle('on', r.value === 'COD' && r.checked); $('#pUPI').classList.toggle('on', r.value === 'UPI' && r.checked); });
      try {
        let sub = 0, net = 0;
        if (buy) { const p = await BB.api('/api/products/' + buy); lines = [{ p, q: qty, line: p.finalPrice * qty }]; sub = p.price * qty; net = p.finalPrice * qty; }
        else { const c = await BB.api('/api/cart'); lines = c.items.map(i => ({ p: i.product, q: i.quantity, line: i.lineTotal })); sub = +c.subtotal; net = +c.subtotal - +c.discount; }
        if (!lines.length) { location.href = '/cart.html'; return; }
        const ship = net >= 499 ? 0 : 40, tax = Math.round(net * 5) / 100;
        $('#items').innerHTML = lines.map(l => `<div class="d-flex gap-3 mb-2 align-items-center"><img src="${BB.img(l.p)}" width="64" height="64" style="object-fit:contain;background:#f6f8fb;border-radius:8px"><div class="flex-grow-1"><div class="fw-semibold">${BB.esc(l.p.name)}</div><div class="small text-muted">Qty ${l.q} · Sold by ${BB.esc(l.p.sellerName)}</div></div><b>${BB.money(l.line)}</b></div>`).join('');
        $('#sum').innerHTML = `<div class="summary-line"><span>Products</span><span>${BB.money(sub)}</span></div><div class="summary-line text-success"><span>Discount</span><span>− ${BB.money(sub - net)}</span></div><div class="summary-line"><span>Shipping</span><span>${ship ? BB.money(ship) : 'FREE'}</span></div><div class="summary-line"><span>Tax (5%)</span><span>${BB.money(tax)}</span></div><div class="summary-line total"><span>Final Total</span><span>${BB.money(net + ship + tax)}</span></div>`;
      } catch (e) { BB.errorState($('#items'), e); }
      $('#place').onclick = async e => {
        const f = $('#addr'); if (!f.reportValidity()) return;
        const body = Object.fromEntries(new FormData(f)); body.paymentMethod = document.querySelector('input[name=pm]:checked').value;
        if (buy) { body.productId = +buy; body.quantity = qty; }
        BB.spin(e.target, true, 'Placing order...');
        try {
          const o = await BB.api('/api/orders', { method: 'POST', body });
          location.href = o.paymentMethod === 'UPI' ? '/payment.html?order=' + o.id : '/order-details.html?id=' + o.id + '&placed=1';
        } catch (x) { BB.fail(x); BB.spin(e.target, false); }
      };
    })();

  </script>
</body>

</html>
