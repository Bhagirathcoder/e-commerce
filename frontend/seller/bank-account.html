<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bank Account | ByteBazaar</title>
    <meta name="description" content="ByteBazaar - Shop More. Live Better.">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="dash">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="dash-main">
            <div class="dash-top" id="dash-top"></div>
            <div class="table-card">
                <p class="text-muted">Add the bank account where your sale earnings (after commission) are paid.</p>
                <div id="bk"></div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/dash.js"></script>
    <script>
        const $ = BB.$;
        if (BB.dash('SELLER', 'bank-account', 'Bank Account')) {
            BB.bankManager($('#bk'));
        }
    </script>
</body>

</html>
