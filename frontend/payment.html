<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UPI Payment | ByteBazaar</title>
  <meta name="description" content="ByteBazaar - Shop More. Live Better.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="bb-header"></div>
  <main class="container-xl page-wrap pt-3">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="bb-card text-center" id="box">
          <div class="loader"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="bb-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>

    const $ = BB.$, oid = BB.qs('order'); let pay;
    async function verify(btn) {
      BB.spin(btn, true, 'Verifying...');
      try { pay = await BB.api('/api/payments/verify', { method: 'POST', body: { paymentId: pay.id } }); BB.toast('Payment verified. Order confirmed!'); setTimeout(() => location.href = '/order-details.html?id=' + oid + '&placed=1', 900); }
      catch (e) { BB.fail(e); BB.spin(btn, false); }
    }
    (async () => {
      if (!await BB.init({ auth: true, roles: ['USER'] })) return;
      try {
        pay = await BB.api('/api/payments/create', { method: 'POST', body: { orderId: +oid } });
        if (pay.status === 'SUCCESS') { location.href = '/order-details.html?id=' + oid; return; }
        $('#box').innerHTML = `<h4>UPI Payment</h4><div class="text-muted mb-2">Order #${pay.orderId}</div><div class="display-6 fw-bold mb-3">${BB.money(pay.amount)}</div>
    <div class="qrbox mb-3"><div id="qr"></div></div><div class="mb-1">Scan with any UPI app, or pay to UPI ID</div><div class="fw-bold fs-5 mb-3"><code>${BB.esc(pay.merchantUpi)}</code> <button class="btn btn-sm btn-light" id="cp"><i class="bi bi-clipboard"></i></button></div>
    ${pay.simulator ? '<div class="alert alert-warning small text-start"><b>Demo mode:</b> no real money moves. “Pay Now” simulates approving the request in your UPI app; the <u>server</u> then verifies the payment with the gateway adapter before confirming your order.</div><button class="btn btn-bb btn-lg w-100 mb-2" id="paynow">Pay Now</button>' : ''}
    <button class="btn btn-navy w-100" id="ver">I have paid — Verify payment</button><div class="small text-muted mt-3">Unpaid UPI orders are cancelled automatically after 30 minutes and stock is released. <a href="/order-details.html?id=${oid}">View order</a></div>`;
        new QRCode($('#qr'), { text: pay.upiUri, width: 190, height: 190 });
        $('#cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(pay.merchantUpi); BB.toast('UPI ID copied'); };
        if (pay.simulator) $('#paynow').onclick = async e => { BB.spin(e.target, true, 'Processing...'); try { await BB.api('/api/payments/simulate', { method: 'POST', body: { paymentId: pay.id } }); await verify($('#ver')); } catch (x) { BB.fail(x); BB.spin(e.target, false); } };
        $('#ver').onclick = e => verify(e.target);
      } catch (e) { BB.errorState($('#box'), e); }
    })();

  </script>
</body>

</html>
